    insertAll('shipments', ['product_key','ym','qty'], EMBEDDED.shipments);
    insertAll('stock_snapshots', ['product_key','ym','qty','day'], EMBEDDED.stock_snapshots);
    insertAll('inbound', ['product_key','ym','qty'], EMBEDDED.inbound);

    function runSql(sql){
      document.getElementById('err').textContent = '';
      try{
        var res = db.exec(sql);
        if(!res.length){ renderTable(['결과'], [['(빈 결과)']]); return; }
        renderTable(res[0].columns, res[0].values);
      }catch(e){
        document.getElementById('err').textContent = '오류: ' + e.message;
        document.getElementById('tbl').innerHTML = '';
        document.getElementById('count').textContent = '';
      }
    }

    document.getElementById('run').addEventListener('click', function(){
      runSql(document.getElementById('sql').value);
    });
    document.querySelectorAll('#tabs button').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on');
        var q = 'SELECT * FROM ' + b.getAttribute('data-t') + ' LIMIT 200;';
        document.getElementById('sql').value = q;
        runSql(q);
      });
    });
    runSql(document.getElementById('sql').value);
  })
  .catch(function(e){
    document.getElementById('err').textContent = 'sql.js 로딩 실패: ' + e.message;
  });
</script>
</body></html>
